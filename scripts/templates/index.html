<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blister Data Collector</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      min-height: 100vh;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #fff; }
    .preview {
      border: 2px solid #333;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      margin-bottom: 1rem;
    }
    .preview img {
      display: block;
      width: 640px;
      height: 480px;
      object-fit: contain;
    }
    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .btn {
      padding: 0.6rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #0f3460;
      color: #fff;
      transition: background 0.2s;
    }
    .btn:hover { background: #16537e; }
    .btn:active { background: #0a2647; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .counter { font-size: 1.1rem; color: #aaa; }
    .counter span { color: #4ecca3; font-weight: bold; }
    .thumbnail-section { margin-top: 1rem; text-align: center; }
    .thumbnail-section h2 { font-size: 1rem; margin-bottom: 0.5rem; color: #aaa; }
    .thumbnail {
      border: 2px solid #333;
      border-radius: 6px;
      overflow: hidden;
      display: inline-block;
    }
    .thumbnail canvas {
      display: block;
      width: 160px;
      height: 120px;
      background: #000;
    }
    .status { margin-top: 0.5rem; font-size: 0.85rem; color: #888; }
  </style>
</head>
<body>
  <h1>Blister Training Data Collector</h1>

  <div class="preview">
    <img id="stream" src="/stream" alt="Live camera preview"
         onerror="this.style.display='none'; document.getElementById('offline').style.display=''">
    <div id="offline" style="display:none; width:640px; height:480px; line-height:480px;
         text-align:center; color:#666; font-size:1.2rem;">
      Waiting for camera stream...
    </div>
  </div>

  <div class="controls">
    <button id="captureBtn" class="btn" onclick="takeShot()">Take Shot</button>
    <span class="counter">Captured: <span id="count">--</span></span>
  </div>

  <div class="thumbnail-section" id="thumbnailSection" style="display:none">
    <h2>Last Capture</h2>
    <div class="thumbnail">
      <canvas id="thumbCanvas" width="160" height="120"></canvas>
    </div>
    <div class="status" id="lastFile"></div>
  </div>

  <script>
    const countEl = document.getElementById('count');
    const streamImg = document.getElementById('stream');

    function updateCount() {
      fetch('/count')
        .then(r => r.json())
        .then(d => { countEl.textContent = d.captured; })
        .catch(() => {});
    }

    updateCount();
    setInterval(updateCount, 5000);

    streamImg.addEventListener('error', function() {
      setTimeout(() => { streamImg.src = '/stream?t=' + Date.now(); }, 2000);
    });

    function takeShot() {
      const btn = document.getElementById('captureBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      fetch('/capture', { method: 'POST' })
        .then(r => {
          if (!r.ok) throw new Error('Capture failed (' + r.status + ')');
          return r.json();
        })
        .then(data => {
          countEl.textContent = data.count;
          document.getElementById('lastFile').textContent = data.filename;

          const canvas = document.getElementById('thumbCanvas');
          const ctx = canvas.getContext('2d');
          ctx.drawImage(streamImg, 0, 0, 160, 120);
          document.getElementById('thumbnailSection').style.display = '';
        })
        .catch(err => { alert('Capture failed: ' + err.message); })
        .finally(() => {
          btn.disabled = false;
          btn.textContent = 'Take Shot';
        });
    }
  </script>
</body>
</html>
